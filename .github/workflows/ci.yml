name: Release quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal spike)"
      - name: Test
        run: go test ./... -count=1
      - name: Race test
        run: go test -race ./internal/app ./internal/adapters/mcp ./cmd/docmanager -count=1
      - name: Vet
        run: go vet ./...

  native-package-smoke:
    name: ${{ matrix.os }} ${{ matrix.arch }} package smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Build CGo-free native executable
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.arch }}
        run: go build -o docmanager ./cmd/docmanager
      - name: Smoke executable and embedded assets
        if: runner.os != 'Windows'
        run: |
          repo="$(mktemp -d)"
          git -C "$repo" init
          ./docmanager doctor --target "$repo"
          ./docmanager install --target "$repo"
          test -f "$repo/.docmanager/.owned"
          test -f "$repo/.docmanager/guidance/AGENTS.md"
          ./docmanager doctor --target "$repo"
          ./docmanager uninstall --target "$repo"
          test ! -e "$repo/.docmanager"
      - name: Smoke executable and embedded assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $repo = Join-Path $env:RUNNER_TEMP "docmanager-smoke"
          New-Item -ItemType Directory -Force $repo | Out-Null
          git -C $repo init
          .\docmanager.exe doctor --target $repo
          .\docmanager.exe install --target $repo
          if (!(Test-Path "$repo/.docmanager/.owned")) { throw "ownership marker missing" }
          if (!(Test-Path "$repo/.docmanager/guidance/AGENTS.md")) { throw "embedded agent guidance missing" }
          .\docmanager.exe doctor --target $repo
          .\docmanager.exe uninstall --target $repo
          if (Test-Path "$repo/.docmanager") { throw "owned state was not removed" }

  cross-build:
    name: ${{ matrix.goos }} ${{ matrix.goarch }} cross-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: dist/docmanager-linux-amd64
          - goos: darwin
            goarch: arm64
            output: dist/docmanager-darwin-arm64
          - goos: windows
            goarch: amd64
            output: dist/docmanager-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Build deterministic CGo-free artifact
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -buildvcs=false -o ${{ matrix.output }} ./cmd/docmanager
      - name: Check executable artifact
        run: test -s ${{ matrix.output }}
