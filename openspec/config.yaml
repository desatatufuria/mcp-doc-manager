schema: spec-driven

context: |
  Project: github.com/desatatufuria/mcp-doc-manager (canonical identity).
  Module: github.com/gentleman-programming/repository-documentation-manager (mismatched; report only, do not change).
  Tech stack: Go 1.26 with github.com/modelcontextprotocol/go-sdk and modernc.org/sqlite.
  Architecture: CLI and stdio MCP entrypoints over internal domain, application, Git, and SQLite adapters.
  Testing: Go standard testing; unit and integration coverage use temporary repositories and MCP stdio.
  Style: gofmt, go vet, package-oriented internal boundaries; technical artifacts are English.

strict_tdd: true

testing:
  detected: 2026-08-01
  strict_tdd: true
  reason: No explicit Strict TDD marker was found; a Go test runner is available, so Strict TDD defaults to enabled.
  test_runner:
    available: true
    command: "go test ./..."
    framework: "Go standard library testing"
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: true
    command: "go test -cover ./..."
  quality:
    linter:
      available: false
      command: ""
    type_checker:
      available: true
      command: "go test ./..."
    formatter:
      available: true
      command: "gofmt -l cmd internal spike"

rules:
  proposal:
    - State scope, non-goals, risks, and rollback plan for risky changes.
  specs:
    - Use RFC 2119 keywords and Given/When/Then scenarios.
    - Keep requirements implementation-independent.
  design:
    - Document architecture decisions and rationale.
    - Include sequence diagrams for complex flows.
  tasks:
    - Group tasks by phase with hierarchical numbering.
    - Keep each task completable in one session.
  apply:
    guidelines:
      - Follow the internal domain, application, and adapter package boundaries.
      - Follow the approved design and task plan.
    tdd: true
    test_command: "go test ./..."
  verify:
    test_command: "go test ./..."
    build_command: "go build ./cmd/docmanager"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
